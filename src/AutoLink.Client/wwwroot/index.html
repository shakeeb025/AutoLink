<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoLink | Intelligent Multi-Dealer Vehicle Marketplace</title>
    <base href="/" />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- MudBlazor Styles -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif;">
            <div style="font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; letter-spacing: 1px;">
                AUTO<span style="color: #38bdf8;">LINK</span>
            </div>
            <div style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px;">
                Connecting Dealerships & Buyers with Intelligent Matching
            </div>
            <div style="width: 48px; height: 48px; border: 4px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; width: 100%; background: #ef4444; color: white; padding: 12px; text-align: center; z-index: 99999;">
        An unhandled error has occurred. <a href="" class="reload" style="color: #fef08a; font-weight: bold;">Reload</a>
    </div>

    <!-- MudBlazor Script -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
